name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  test-linux:
    name: Linux tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=85 --durations=25

  test-windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=85 --durations=25 --reruns 2 --rerun-delay 5 --only-rerun "Failed to apply logs to the hnsw segment writer"

  test-macos:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --ignore=tests/benchmarks --cov=mempalace --cov-report=term-missing --cov-fail-under=85 --durations=25

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: |
          python -m pip install "ruff==0.15.20"
      - name: Run Ruff static analysis
        run: |
          python -m ruff check .
      - name: Check Ruff formatting
        run: |
          python -m ruff format --check .
